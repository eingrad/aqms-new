# AQMS Mosquitto — two listeners:
#   1883  plain MQTT  — internal only (the aqms-ingest container connects here)
#   9001  websockets  — reached from the internet via the Cloudflare tunnel (WSS at the edge)
# Auth + ACL apply to both. No host ports are published; 9001 is exposed only through cloudflared.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
